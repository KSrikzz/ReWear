spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: rewear-api
  datasource:
    url: ${SUPABASE_DB_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 18
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_JWT_ISSUER}
          jwk-set-uri: ${SUPABASE_JWKS_URL}
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

rewear:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  open-ai-api-key: ${OPENAI_API_KEY:}
  open-ai-model: ${OPENAI_MODEL:gpt-5-mini}
  admin:
    emails: ${REWEAR_ADMIN_EMAILS:}
  finance:
    currency: ${PLATFORM_CURRENCY:INR}
    personal-listing-fee-percent: ${PERSONAL_LISTING_FEE_PERCENT:0.03}
    personal-order-commission-percent: ${PERSONAL_ORDER_COMMISSION_PERCENT:0.05}
    silver-monthly-price: ${BUSINESS_SILVER_MONTHLY_PRICE:999}
    gold-monthly-price: ${BUSINESS_GOLD_MONTHLY_PRICE:1999}
    silver-listing-fee-percent: ${BUSINESS_SILVER_LISTING_FEE_PERCENT:0.08}
    gold-listing-fee-percent: ${BUSINESS_GOLD_LISTING_FEE_PERCENT:0.05}
    protection-base-rate-percent: ${PROTECTION_BASE_RATE_PERCENT:0.05}
    protection-min-premium: ${PROTECTION_MIN_PREMIUM:49}
    protection-max-premium: ${PROTECTION_MAX_PREMIUM:499}
    standard-claim-window-hours: ${PROTECTION_STANDARD_CLAIM_WINDOW_HOURS:48}
    high-value-claim-window-hours: ${PROTECTION_HIGH_VALUE_CLAIM_WINDOW_HOURS:24}
    high-value-threshold: ${HIGH_VALUE_PRODUCT_THRESHOLD:10000}
    high-value-protection-required: ${HIGH_VALUE_PROTECTION_REQUIRED:true}
    standard-coverage-limit: ${PROTECTION_STANDARD_COVERAGE_LIMIT:5000}
    high-value-coverage-limit: ${PROTECTION_HIGH_VALUE_COVERAGE_LIMIT:10000}
